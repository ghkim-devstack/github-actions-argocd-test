apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-actions-nginx
  namespace: gitops-nginx-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: github-actions-nginx
  template:
    metadata:
      labels:
        app: github-actions-nginx
    spec:
      containers:
        - name: nginx
          image: ghcr.io/ghkim-devstack/github-actions-argocd-test:latest
          ports:
            - containerPort: 80
